name: android

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - android-2.7-compat
    paths-ignore:
      - 'README.md'
      - 'LICENSE.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: 'default,readwrite'

jobs:
  build-android:
    name: android-arm64-${{ matrix.build_type }}
    runs-on: windows-2025
    if: github.event_name == 'push'
    strategy:
      fail-fast: true
      matrix:
        build_type: [debug]

    steps:
      # Step 1
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Qt 6.11.1 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true
          setup-python: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Step 2
      # Host tooling (qtprotoc_host ExternalProject, arm64-android vcpkg host ports)
      # is compiled with MSVC, so the Developer Command Prompt must be set up. This
      # also puts the bundled Ninja on PATH, which the Ninja generator requires.
      - name: Set MSVC parameters
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          toolset: 14.44

      # Step 3
      - name: Configure and build APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg-bincache-arm64-android
          VCPKG_DOWNLOADS: ${{ github.workspace }}\.cache\vcpkg-downloads
        run: |
          $env:QT_ANDROID_PATH = $env:QT_ROOT_DIR
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          $env:ANDROID_NDK_ROOT = Join-Path $env:ANDROID_HOME "ndk\27.2.12479018"
          $env:ANDROID_NDK_HOME = $env:ANDROID_NDK_ROOT

          Write-Host "QT_ANDROID_PATH=$env:QT_ANDROID_PATH"
          Write-Host "QT_HOST_PATH=$env:QT_HOST_PATH"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          Write-Host "ANDROID_NDK_ROOT=$env:ANDROID_NDK_ROOT"
          Write-Host "JAVA_HOME=$env:JAVA_HOME"

          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null

          cmake --preset ci-android-${{ matrix.build_type }}
          cmake --build --preset ci-android-apk-${{ matrix.build_type }}

      # Step 4
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aspia-android-arm64-${{ matrix.build_type }}
          path: |
            ${{ github.workspace }}/builds/ci-android-${{ matrix.build_type }}/source/client/android-build/build/outputs/apk/${{ matrix.build_type }}/*.apk
            ${{ github.workspace }}/builds/ci-android-${{ matrix.build_type }}/source/host/android-build/build/outputs/apk/${{ matrix.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 7
